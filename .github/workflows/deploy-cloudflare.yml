name: Deploy Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creditbridge-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CREDITBRIDGE_D1_DATABASE_ID: ${{ secrets.CREDITBRIDGE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CREDITBRIDGE_D1_DATABASE_ID"

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run cloudflare:prepare
      - run: npm run cloudflare:migrate
      - run: npm run cloudflare:publish
